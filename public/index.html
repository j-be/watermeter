<html>

<head>
  <title>Watermeter</title>
  <style>
    .camera, #canvas, .output {
      visibility: hidden;
    }
  </style>
</head>

<body>
  <span id="last-upload">never</span>
  <div class="camera">
    <video id="video">Video stream not available.</video>
    <button id="start-button">Capture photo</button>

  <canvas id="canvas"></canvas>
  <div class="output">
    <img id="photo" src="" alt="The screen capture will appear in this box." />
  </div>

  <script src="camy.js"></script>
</body>

</html>
